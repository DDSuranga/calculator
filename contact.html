<body>
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M6K9R66W"
    height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <div class="container contact-container">
    <nav class="d-flex flex-wrap justify-content-center gap-3 mb-4" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="about.html">About Us</a>
      <a href="privacy-policy.html">Privacy Policy</a>
    </nav>
    <h1 class="text-center mb-4">Contact Us</h1>

    <form id="contact-form">
      <div class="mb-3">
        <label for="name" class="form-label">Your Name *</label>
        <input type="text" class="form-control" id="name" required />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address *</label>
        <input type="email" class="form-control" id="email" required />
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Message *</label>
        <textarea class="form-control" id="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100">Send Message</button>
    </form>

    <div class="alert alert-success mt-3" id="success-alert">
      ✅ Your message request was accepted. Inbox delivery is not yet confirmed.
    </div>

    <div class="social-links">
      <h5 class="mt-4">Connect With Us</h5>
      <a href="https://wa.me/94761499141" target="_blank" title="WhatsApp +94 76 149 9141">
        📱 +94 76 149 9141
      </a>
      <a href="mailto:onlinecalmaster@gmail.com" title="Email">
        ✉️
      </a>
    </div>
  </div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2.6.4/dist/email.min.js"></script>
  <script>
    let emailjsReady = false;
    let initializationPhase = 'SDK';
    try {
      if (typeof emailjs !== 'undefined' && typeof emailjs.init === 'function' && typeof emailjs.send === 'function') {
        initializationPhase = 'INIT';
        emailjs.init("eUrV1CCbtewUbs8cg");
        emailjsReady = true;
      }
    } catch (_) {
      // Keep the form usable and report a safe diagnostic when the user submits.
    }

    function reportContactFailure(error, phase) {
      const status = error && Number.isInteger(error.status) && error.status >= 0 && error.status <= 599
        ? error.status : null;
      const timestamp = new Date().toISOString();
      const reference = 'CONTACT-' + phase + '-' + (status === null ? 'UNKNOWN' : status) + '-' + Date.now();
      // Do not log form values, provider response text, credentials or raw errors.
      console.error('Contact form request failed', { reference, phase, status, timestamp });
      alert('Unable to send your message. Please email onlinecalmaster@gmail.com directly. Reference: ' + reference);
    }

    document.getElementById("contact-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const form = document.getElementById("contact-form");
      const button = form.querySelector('button[type="submit"]');
      if (button.disabled) return;
      document.getElementById("success-alert").style.display = "none";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();
      if (!name || !email || !message) {
        alert("Please fill in all required fields.");
        return;
      }
      if (!document.getElementById("email").checkValidity()) {
        alert("Please enter a valid email address.");
        return;
      }
      if (!emailjsReady) {
        reportContactFailure(null, initializationPhase);
        return;
      }

      const params = { from_name: name, from_email: email, message: message };
      button.disabled = true;
      const originalLabel = button.textContent;
      button.textContent = 'Sending…';
      try {
        await emailjs.send("service_7r5glod", "template_ifknzgp", params);
        document.getElementById("success-alert").style.display = "block";
        form.reset();
      } catch (error) {
        reportContactFailure(error, 'SEND');
      } finally {
        button.disabled = false;
        button.textContent = originalLabel;
      }
    });
  </script>
